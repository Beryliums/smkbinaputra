<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMK Bina Putra Cihampelas</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
* {
  box-sizing: border-box;
  margin: 0;
}

/* ===== WARNA: ubah nilai di :root ini untuk mengganti seluruh tema ===== */
:root {
  --bg: #FFFFFF; /* latar halaman (putih) */
  --soft: #F3F8FC; /* putih kebiruan: kolom isian, baris thread, footer */
  --tint: #E6F1FA; /* biru sangat muda: menu aktif, slide aktif */
  --card: #FFFFFF; /* latar kartu */
  --ink: #0B2236; /* warna teks utama */
  --mut: #52687A; /* teks sekunder */
  --line: #E1EAF1; /* garis tipis */
  --blue: #0F6FB0; /* biru link */
  color-scheme: light;
  --navy: #0A2A43; /* biru tua (overlay foto, toast) */
  --yel: #F4B41A; /* kuning aksen (label, progress) */
  --red: #E0382D;
  --btn: #0F6FB0; /* warna tombol */
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}

html {
  scroll-padding-top: env(safe-area-inset-top,0px);
  height: 100%;
}

body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.55 Figtree,system-ui,sans-serif;
  min-height: 100%;
}

h1,h2,h3,.brand b,.ri b {
  font-family: "Bricolage Grotesque","Trebuchet MS",sans-serif;
  line-height: 1.15;
  letter-spacing: -.01em;
}

a {
  color: var(--blue);
}

:focus-visible {
  outline: 3px solid var(--yel);
  outline-offset: 2px;
}

.wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 16px;
}

.narrow {
  max-width: 760px;
}

/* ===== Header dan menu ===== */
header {
  position: sticky;
  top: env(safe-area-inset-top,0px);
  z-index: 20;
  background: var(--card);
  border-bottom: 1px solid var(--line);
}

.hd {
  max-width: 1200px;
  margin: 0 auto;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  gap: 10px;
  align-items: center;
  text-decoration: none;
  color: var(--ink);
}

.brand img {
  width: 44px;
  height: 44px;
}

.brand b {
  display: block;
  font-size: 1.1rem;
}

.brand small {
  color: var(--mut);
  font-size: .78rem;
}

nav {
  display: flex;
  gap: 4px;
  margin-left: auto;
  overflow-x: auto;
}

nav a {
  padding: 8px 14px;
  border-radius: 999px;
  text-decoration: none;
  color: var(--ink);
  font-weight: 600;
  white-space: nowrap;
}

nav a.on {
  background: var(--tint);
  color: var(--blue);
}

.me {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: .9rem;
}

.btn {
  background: var(--btn);
  color: #fff;
  border: 0;
  border-radius: 999px;
  padding: 10px 18px;
  font: 600 .95rem Figtree,sans-serif;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
}

.ghost {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink);
  border-radius: 999px;
  padding: 9px 16px;
  font: inherit;
  cursor: pointer;
}

.lnk {
  background: none;
  border: 0;
  color: var(--blue);
  font: 600 .85rem Figtree;
  cursor: pointer;
  padding: 4px 0;
}

/* ===== Carousel Beranda ===== */
.hero {
  max-width: 1200px;
  margin: 0 auto;
  padding: 16px;
  display: grid;
  grid-template-columns: 1fr 270px;
  gap: 12px;
}

.stage {
  position: relative;
  aspect-ratio: 16/8;
  border-radius: 18px;
  overflow: hidden;
  background: var(--navy);
  min-width: 0;
}

.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity .6s;
}

.slide.on {
  opacity: 1;
}

.slide>img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
}

.slide.fit::before {
  content: "";
  position: absolute;
  inset: -20px;
  background: var(--img) center/cover;
  filter: blur(22px) brightness(.6);
}

.slide.fit>img {
  object-fit: contain;
  object-position: right center;
}

.slide::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  background: linear-gradient(to top,rgba(10,42,67,.92),rgba(10,42,67,0) 62%);
}

.cap {
  position: absolute;
  left: 0;
  bottom: 0;
  z-index: 3;
  padding: clamp(16px,3vw,32px);
  color: #fff;
  max-width: 640px;
}

.fit .cap {
  max-width: min(430px,50%);
}

.cap h2 {
  font-size: clamp(1.35rem,3.2vw,2.4rem);
  margin: 8px 0;
}

.cap p {
  opacity: .92;
  margin-bottom: 14px;
}

.tag {
  background: var(--yel);
  color: var(--navy);
  padding: 3px 10px;
  border-radius: 6px;
  font-weight: 600;
  font-size: .8rem;
  display: inline-block;
}

.arr {
  position: absolute;
  top: 50%;
  translate: 0 -50%;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 0;
  background: rgba(255,255,255,.88);
  color: var(--navy);
  z-index: 4;
  font-size: 1.5rem;
  cursor: pointer;
}

.prev {
  left: 10px;
}

.next {
  right: 10px;
}

.rail {
  display: grid;
  gap: 10px;
  grid-auto-rows: 1fr;
}

.ri {
  position: relative;
  overflow: hidden;
  text-align: left;
  padding: 14px;
  border-radius: 12px;
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--ink);
  font: inherit;
  cursor: pointer;
}

.ri.on {
  border-color: var(--blue);
  background: var(--tint);
}

.ri .tag {
  margin-bottom: 6px;
}

.ri b {
  display: block;
  font-size: 1rem;
}

.pb {
  position: absolute;
  left: 0;
  bottom: 0;
  height: 4px;
  width: 0;
  background: var(--yel);
}

.ri.on .pb {
  animation: fill 6s linear forwards;
}

@keyframes fill {
  to {
    width: 100%;
  }
}

.hero:hover .pb,.hero:focus-within .pb {
  animation-play-state: paused;
}

/* ===== Berita (kartu) dan judul bagian ===== */
.sec {
  margin: 34px 0;
}

.sh {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin: 22px 0 14px;
}

.sh h2 {
  font-size: 1.6rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(260px,1fr));
  gap: 16px;
}

.card {
  display: block;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
}

.card:hover {
  border-color: var(--blue);
}

.card img {
  width: 100%;
  aspect-ratio: 16/10;
  object-fit: cover;
  display: block;
}

.card div {
  padding: 14px;
}

.card h3 {
  font-size: 1.1rem;
  margin: 4px 0;
}

.meta {
  color: var(--mut);
  font-size: .85rem;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

/* ===== Forum: thread, komentar, filter ===== */
.trow {
  display: flex;
  gap: 12px;
  padding: 14px;
  background: var(--soft);
  border: 1px solid var(--line);
  border-radius: 14px;
  text-decoration: none;
  color: inherit;
  margin-bottom: 10px;
}

.trow:hover {
  border-color: var(--blue);
}

.trow h3 {
  font-size: 1.05rem;
  margin-bottom: 2px;
}

.trow .n {
  margin-left: auto;
  color: var(--mut);
  font-size: .85rem;
  white-space: nowrap;
}

.av {
  flex: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 600;
  font-size: .9rem;
}

.cat {
  background: rgba(244,180,26,.22);
  color: var(--ink);
  border-radius: 6px;
  padding: 2px 8px;
  font-size: .78rem;
  font-weight: 600;
}

.role {
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 0 6px;
  font-size: .75rem;
}

.chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  align-items: center;
}

.chip {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  border-radius: 999px;
  padding: 7px 14px;
  font: 600 .88rem Figtree;
  cursor: pointer;
}

.chip.on {
  background: var(--btn);
  color: #fff;
  border-color: var(--btn);
}

input,select,textarea {
  width: 100%;
  margin-top: 4px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--soft);
  color: inherit;
  font: inherit;
}

.chips input {
  width: 220px;
  margin: 0 0 0 auto;
}

.post {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 20px;
  margin: 14px 0 24px;
}

.post h2 {
  margin: 8px 0;
}

.body {
  white-space: pre-wrap;
  margin: 12px 0;
}

.cm {
  display: flex;
  gap: 10px;
  padding: 14px 10px;
  border-top: 1px solid var(--line);
}

.cm.best {
  background: rgba(244,180,26,.14);
  border-radius: 10px;
}

.cf {
  display: grid;
  gap: 10px;
  justify-items: start;
  margin: 18px 0 40px;
}

.empty {
  color: var(--mut);
  padding: 30px 0;
  text-align: center;
}

/* ===== Halaman berita ===== */
.art img {
  width: 100%;
  max-height: 420px;
  object-fit: cover;
  border-radius: 14px;
  margin: 14px 0;
}

/* ===== Popup dan form ===== */
dialog {
  border: 0;
  border-radius: 16px;
  padding: 22px;
  width: min(440px,92vw);
  background: var(--card);
  color: var(--ink);
  margin: auto;
}

dialog::backdrop {
  background: rgba(10,42,67,.35);
}

dialog label {
  display: block;
  margin-top: 12px;
  font-weight: 600;
  font-size: .9rem;
}

.act {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 18px;
}

.m {
  color: var(--mut);
  font-size: .9rem;
  margin: 6px 0;
}

#toast {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom,0px));
  translate: -50% 20px;
  background: var(--navy);
  color: #fff;
  padding: 10px 18px;
  border-radius: 999px;
  opacity: 0;
  pointer-events: none;
  transition: .3s;
  z-index: 50;
}

#toast.on {
  opacity: 1;
  translate: -50% 0;
}

/* ===== Footer dan halaman Tentang ===== */
footer {
  background: var(--soft);
  color: var(--mut);
  border-top: 1px solid var(--line);
  margin-top: 50px;
  padding: 26px 16px;
  text-align: center;
  font-size: .9rem;
}

.soon {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(220px,1fr));
  gap: 10px;
  margin-top: 14px;
}

.soon div {
  padding: 12px 14px;
  border: 1px dashed var(--line);
  border-radius: 10px;
  color: var(--mut);
}

@media(max-width:820px) {
  .hero {
    grid-template-columns: 1fr;
  }
  .stage {
    aspect-ratio: 4/3;
  }
  .rail {
    display: flex;
    overflow-x: auto;
  }
  .ri {
    min-width: 210px;
  }
  .fit .cap {
    max-width: 100%;
  }
  nav {
    margin-left: 0;
    width: 100%;
  }
  .chips input {
    width: 100%;
    margin: 0;
  }
}

@media(prefers-reduced-motion:reduce) {
  .slide {
    transition: none;
  }
  .pb {
    animation: none!important;
  }
}

.card,.post,.ri {
  box-shadow: 0 1px 3px rgba(10,42,67,.06);
}
</style></head><body>
<header><div class="hd"><a class="brand" href="#/"><img id="logo" alt="Logo SMK Bina Putra"><span><b>SMK Bina Putra</b><small>Cihampelas, Kab. Bandung Barat</small></span></a>
<nav id="nav"><a href="#/">Beranda</a><a href="#/berita">Berita</a><a href="#/forum">Forum</a><a href="#/tentang">Tentang</a></nav><div class="me" id="me"></div></div></header>
<main id="app"></main>
<footer>---.</footer>
<dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script>
/* =====================================================================
   SMK BINA PUTRA - PROTOTYPE WEBSITE

   Urutan isi file ini:
     1. PENGATURAN  isi slide, kategori forum, data contoh (edit di sini)
     2. HELPER      fungsi kecil: tanggal, escape HTML, avatar, toast
     3. STATE       data yang disimpan di browser (localStorage)
     4. TAMPILAN    fungsi yang membuat HTML tiap halaman
     5. AKSI        login, posting thread, komentar, tulis berita
     6. ROUTER      ganti halaman sesuai alamat (#/forum, #/berita, dst)
   ===================================================================== */


/* ---------------------------------------------------------------------
   1. PENGATURAN
   --------------------------------------------------------------------- */

// Slide carousel di Beranda.
//   img  : kunci foto di objek IMG (ada di bagian paling bawah file)
//   fit  : true = foto tampil utuh di kanan dengan latar blur (untuk foto kotak)
//   href : tujuan tombol, cta: tulisan tombol
const SLIDES = [
  {
    img: 'gate',
    tag: 'Pendaftaran',
    title: 'Penerimaan peserta didik baru',
    text: 'Cek persyaratan dan alur pendaftaran SMK Bina Putra.',
    href: '#/tentang',
    cta: 'Lihat alur pendaftaran',
    alt: 'Gerbang SMK Bina Putra',
  },
  {
    img: 'cert',
    tag: 'Alumni',
    title: 'Penyerahan ijazah dan sertifikat kelulusan',
    text: 'Selamat untuk para lulusan. Tetap terhubung lewat forum alumni.',
    href: '#/forum',
    cta: 'Gabung forum',
    alt: 'Penyerahan ijazah kepada lulusan',
  },
  {
    img: 'coll',
    fit: true,
    tag: 'Kegiatan',
    title: 'Apel pagi dan kunjungan ke sekolah',
    text: 'Rabu, 22 Januari 2025.',
    href: '#/berita/3',
    cta: 'Baca beritanya',
    alt: 'Apel pagi siswa',
  },
];

const FORUM_FILTERS = ['Semua', 'Tanya Jawab', 'Alumni', 'Info Sekolah'];
const THREAD_CATEGORIES = ['Tanya Jawab', 'Alumni', 'Info Sekolah'];
const ROLES = ['Siswa', 'Alumni', 'Admin'];
const STORAGE_KEY = 'sbp2';

// Isi awal website (berita dan thread contoh). Ganti dengan konten asli.
function contohData() {
  return {
    user: null,
    news: [
      {
        id: 3, img: 'coll', title: 'Apel pagi dan kunjungan ke sekolah',
        date: Date.parse('2025-01-22'),
        body: 'Contoh isi berita. Admin dapat mengganti teks ini dengan berita asli, lengkap dengan foto kegiatan.',
      },
      {
        id: 2, img: 'cert', title: 'Penyerahan ijazah dan sertifikat kelulusan',
        date: daysAgo(40),
        body: 'Contoh isi berita. Tulis tanggal, nama kegiatan, dan siapa saja yang hadir.',
      },
      {
        id: 1, img: 'gate', title: 'Penerimaan peserta didik baru dibuka',
        date: daysAgo(80),
        body: 'Contoh isi berita. Cantumkan jadwal, syarat, dan tautan pendaftaran.',
      },
    ],
    threads: [
      {
        id: 3, category: 'Info Sekolah', title: 'Cara memakai forum ini',
        body: 'Masuk dengan akun Google, lalu mulai thread atau tulis komentar.\nUntuk Tanya Jawab, penanya bisa menandai jawaban terbaik.',
        author: 'Admin Sekolah', role: 'Admin', date: daysAgo(3),
        likes: [], best: null, comments: [],
      },
      {
        id: 2, category: 'Alumni', title: 'Alumni, yuk kumpul',
        body: 'Ada yang mau bikin reuni kecil? Tulis kota domisili kalian di komentar.',
        author: 'Dimas', role: 'Alumni', date: daysAgo(2),
        likes: ['Rani'], best: null,
        comments: [{ author: 'Rani', role: 'Alumni', text: 'Aku di Bandung, ikut!', date: daysAgo(1) }],
      },
      {
        id: 1, category: 'Tanya Jawab', title: 'Bagaimana alur pendaftaran siswa baru?',
        body: 'Saya mau mendaftar tahun depan. Dokumen apa saja yang perlu disiapkan?',
        author: 'Salsa', role: 'Siswa', date: daysAgo(1),
        likes: [], best: 0,
        comments: [{
          author: 'Admin Sekolah', role: 'Admin', date: daysAgo(0.5),
          text: 'Alur lengkap akan dipasang di halaman Tentang. Sementara, hubungi sekolah lewat halaman Kontak.',
        }],
      },
    ],
  };
}


/* ---------------------------------------------------------------------
   2. HELPER
   --------------------------------------------------------------------- */

const $ = selector => document.querySelector(selector);
const dlg = $('#dlg'); // kotak popup (login, form thread, form berita)

function daysAgo(n) {
  return Date.now() - n * 864e5;
}

// Cegah teks pengguna dibaca sebagai HTML
function esc(text) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return String(text).replace(/[&<>"']/g, c => map[c]);
}

function timeAgo(ts) {
  const minutes = (Date.now() - ts) / 6e4;
  if (minutes < 2) return 'baru saja';
  if (minutes < 60) return Math.floor(minutes) + ' menit lalu';
  if (minutes < 1440) return Math.floor(minutes / 60) + ' jam lalu';
  if (minutes < 43200) return Math.floor(minutes / 1440) + ' hari lalu';
  return new Date(ts).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
}

function formatDate(ts) {
  return new Date(ts).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
}

// Lingkaran berisi huruf pertama nama, warnanya ditentukan dari nama
function avatar(name) {
  const hue = (name.charCodeAt(0) * 47) % 360;
  return `<span class="av" style="background:hsl(${hue} 50% 36%)">${esc(name[0] || '?')}</span>`;
}

function roleBadge(role) {
  return `<span class="role">${esc(role)}</span>`;
}

function toast(message) {
  const el = $('#toast');
  el.textContent = message;
  el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 2200);
}


/* ---------------------------------------------------------------------
   3. STATE (disimpan di browser; versi asli nanti di database MySQL)
   --------------------------------------------------------------------- */

let state = loadState();
let forumFilter = 'Semua';
let forumSearch = '';

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved) return saved;
  } catch (e) { /* abaikan, pakai data contoh */ }
  return contohData();
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* abaikan */ }
}

const isAdmin = () => state.user && state.user.role === 'Admin';


/* ---------------------------------------------------------------------
   4. TAMPILAN
   --------------------------------------------------------------------- */

/* ----- Beranda: carousel ----- */

function carouselHtml() {
  const slides = SLIDES.map(s => `
    <article class="slide${s.fit ? ' fit' : ''}" style="--img:url(${IMG[s.img]})">
      <img src="${IMG[s.img]}" alt="${s.alt}">
      <div class="cap">
        <span class="tag">${s.tag}</span>
        <h2>${s.title}</h2>
        <p>${s.text}</p>
        <a class="btn" href="${s.href}">${s.cta}</a>
      </div>
    </article>`).join('');

  const rail = SLIDES.map(s => `
    <button class="ri">
      <span class="tag">${s.tag}</span>
      <b>${s.title}</b>
      <i class="pb"></i>
    </button>`).join('');

  return `
    <section class="hero" aria-label="Sorotan sekolah">
      <div class="stage" id="stage">
        ${slides}
        <button class="arr prev" aria-label="Sebelumnya">‹</button>
        <button class="arr next" aria-label="Berikutnya">›</button>
      </div>
      <div class="rail">${rail}</div>
    </section>`;
}

// Pasang perilaku carousel setelah HTML-nya tampil.
// Geser otomatis: saat garis kuning di daftar kanan selesai terisi (animasi CSS 6 detik),
// slide pindah. Animasi berhenti saat kursor di atas carousel.
function startCarousel() {
  const slides = [...document.querySelectorAll('.slide')];
  const items = [...document.querySelectorAll('.ri')];
  const stage = $('#stage');
  if (!slides.length) return;

  let current = 0;

  function show(n) {
    current = (n + slides.length) % slides.length;
    slides.forEach((slide, i) => {
      slide.classList.toggle('on', i === current);
      slide.inert = i !== current; // slide tersembunyi tidak bisa difokus
    });
    items.forEach((item, i) => {
      item.classList.toggle('on', i === current);
      const bar = item.lastElementChild;
      bar.style.animation = 'none'; // ulang animasi dari nol
      bar.offsetWidth;
      bar.style.animation = '';
    });
  }

  items.forEach((item, i) => {
    item.onclick = () => show(i);
    item.lastElementChild.onanimationend = () => show(current + 1);
  });
  $('.prev').onclick = () => show(current - 1);
  $('.next').onclick = () => show(current + 1);

  // Geser dengan jari/mouse
  let startX = null;
  stage.onpointerdown = e => { startX = e.clientX; };
  stage.onpointerup = e => {
    if (startX !== null && Math.abs(e.clientX - startX) > 40) {
      show(current + (e.clientX < startX ? 1 : -1));
    }
    startX = null;
  };

  show(0);
}

/* ----- Potongan yang dipakai berulang ----- */

function newsCard(n) {
  return `
    <a class="card" href="#/berita/${n.id}">
      <img src="${IMG[n.img]}" alt="">
      <div>
        <span class="meta">${formatDate(n.date)}</span>
        <h3>${esc(n.title)}</h3>
      </div>
    </a>`;
}

function threadRow(t) {
  return `
    <a class="trow" href="#/forum/${t.id}">
      ${avatar(t.author)}
      <div>
        <span class="cat">${t.category}</span>
        <h3>${esc(t.title)}</h3>
        <div class="meta">${esc(t.author)} ${roleBadge(t.role)} · ${timeAgo(t.date)}</div>
      </div>
      <span class="n">${t.comments.length} komentar</span>
    </a>`;
}

/* ----- Halaman ----- */

function viewHome() {
  return carouselHtml() + `
    <div class="wrap">
      <div class="sh"><h2>Berita terbaru</h2><a href="#/berita">Semua berita</a></div>
      <div class="grid">${state.news.slice(0, 3).map(newsCard).join('')}</div>

      <div class="sh" style="margin-top:40px"><h2>Obrolan di forum</h2><a href="#/forum">Buka forum</a></div>
      ${state.threads.slice(0, 3).map(threadRow).join('')}
    </div>`;
}

function viewNewsList() {
  const action = isAdmin()
    ? '<button class="btn" onclick="openNewNews()">Tulis berita</button>'
    : '<span class="m">Hanya admin yang bisa menulis berita.</span>';

  return `
    <div class="wrap">
      <div class="sh"><h2>Berita sekolah</h2>${action}</div>
      <div class="grid">${state.news.map(newsCard).join('')}</div>
    </div>`;
}

function viewNewsDetail(id) {
  const n = state.news.find(item => item.id == id);
  if (!n) return '<div class="wrap"><p class="empty">Berita tidak ditemukan.</p></div>';

  return `
    <div class="wrap narrow art">
      <a href="#/berita">‹ Semua berita</a>
      <h2 style="margin-top:12px;font-size:2rem">${esc(n.title)}</h2>
      <div class="meta">${formatDate(n.date)}</div>
      <img src="${IMG[n.img]}" alt="">
      <p class="body">${esc(n.body)}</p>
    </div>`;
}

function threadListHtml() {
  const keyword = forumSearch.toLowerCase();
  const list = state.threads.filter(t =>
    (forumFilter === 'Semua' || t.category === forumFilter) &&
    (t.title + t.body).toLowerCase().includes(keyword));

  return list.length
    ? list.map(threadRow).join('')
    : '<p class="empty">Belum ada thread yang cocok. Mulai thread pertama di kategori ini.</p>';
}

function viewForum() {
  const chips = FORUM_FILTERS.map(name =>
    `<button class="chip${name === forumFilter ? ' on' : ''}" onclick="setForumFilter('${name}')">${name}</button>`
  ).join('');

  return `
    <div class="wrap">
      <div class="sh"><h2>Forum sekolah</h2><button class="btn" onclick="openNewThread()">Mulai thread</button></div>
      <div class="chips">
        ${chips}
        <input type="search" placeholder="Cari thread" aria-label="Cari thread"
               value="${esc(forumSearch)}" oninput="setForumSearch(this.value)">
      </div>
      <div id="tl">${threadListHtml()}</div>
    </div>`;
}

function commentHtml(thread, c, index, viewerOwnsThread) {
  const isBest = thread.best === index;
  const canMark = viewerOwnsThread && thread.category === 'Tanya Jawab' && !isBest && c.author !== thread.author;

  return `
    <div class="cm${isBest ? ' best' : ''}">
      ${avatar(c.author)}
      <div>
        <div class="meta">
          <b>${esc(c.author)}</b> ${roleBadge(c.role)} · ${timeAgo(c.date)}
          ${isBest ? '<span class="cat">Jawaban terbaik</span>' : ''}
        </div>
        <p>${esc(c.text)}</p>
        ${canMark ? `<button class="lnk" onclick="markBest(${thread.id}, ${index})">Tandai jawaban terbaik</button>` : ''}
      </div>
    </div>`;
}

function viewThread(id) {
  const t = state.threads.find(item => item.id == id);
  if (!t) return '<div class="wrap"><p class="empty">Thread tidak ditemukan.</p></div>';

  const me = state.user;
  const ownsThread = !!me && me.name === t.author;
  const liked = !!me && t.likes.includes(me.name);
  const placeholder = me ? 'Tulis komentar' : 'Masuk untuk ikut berkomentar';

  return `
    <div class="wrap narrow">
      <a href="#/forum" style="display:inline-block;margin-top:14px">‹ Kembali ke forum</a>

      <article class="post">
        <span class="cat">${t.category}</span>
        <h2>${esc(t.title)}</h2>
        <div class="meta">${avatar(t.author)} ${esc(t.author)} ${roleBadge(t.role)} · ${timeAgo(t.date)}</div>
        <p class="body">${esc(t.body)}</p>
        <button class="chip${liked ? ' on' : ''}" onclick="toggleLike(${t.id})">Suka · ${t.likes.length}</button>
      </article>

      <h3>${t.comments.length} komentar</h3>
      ${t.comments.map((c, i) => commentHtml(t, c, i, ownsThread)).join('')}

      <div class="cf">
        <textarea id="ct" rows="3" maxlength="800" placeholder="${placeholder}" aria-label="Komentar"></textarea>
        <button class="btn" onclick="submitComment(${t.id})">Kirim komentar</button>
      </div>
    </div>`;
}

function viewAbout() {
  const comingSoon = [
    'Profil dan prestasi', 'Komite dan tenaga pendidik', 'Alur pendaftaran', 'Kalender pendidikan',
    'Ekstrakurikuler', 'Perpustakaan', 'Alumni', 'Kontak',
  ].map(name => `<div>${name}<br><small>Segera hadir</small></div>`).join('');

  return `
    <div class="wrap narrow">
      <div class="sh"><h2>Tentang sekolah</h2></div>
      <p>SMK Bina Putra berada di Cihampelas, Kabupaten Bandung Barat. Halaman ini akan memuat profil lengkap sekolah.</p>
      <div class="soon">${comingSoon}</div>
    </div>`;
}

/* ----- Login (demo; versi asli memakai Google Sign-In) ----- */

function requireLogin() {
  if (state.user) return true;
  openLogin();
  return false;
}

function openLogin() {
  const roleOptions = ROLES.map(r => `<option>${r}</option>`).join('');
  dlg.innerHTML = `
    <h2>Masuk</h2>
    <p class="m">Di versi asli, tombol ini membuka login Google. Untuk demo, isi nama dan peran.</p>
    <form onsubmit="submitLogin(event)">
      <label>Nama<input name="name" required maxlength="30"></label>
      <label>Peran<select name="role">${roleOptions}</select></label>
      <div class="act">
        <button type="button" class="ghost" onclick="dlg.close()">Batal</button>
        <button class="btn">Lanjut dengan Google</button>
      </div>
    </form>`;
  dlg.showModal();
}

function submitLogin(e) {
  e.preventDefault();
  const form = e.target;
  state.user = { name: form.name.value.trim(), role: form.role.value };
  saveState();
  dlg.close();
  render();
  toast('Halo, ' + state.user.name);
}

function logout() {
  state.user = null;
  saveState();
  render();
  toast('Kamu sudah keluar');
}

/* ----- Forum ----- */

function setForumFilter(name) {
  forumFilter = name;
  render();
}

function setForumSearch(text) {
  forumSearch = text;
  $('#tl').innerHTML = threadListHtml(); // hanya daftar yang diganti, kolom cari tetap fokus
}

function openNewThread() {
  if (!requireLogin()) return;
  const categoryOptions = THREAD_CATEGORIES.map(c => `<option>${c}</option>`).join('');
  dlg.innerHTML = `
    <h2>Mulai thread</h2>
    <form onsubmit="submitThread(event)">
      <label>Judul<input name="title" required maxlength="100"></label>
      <label>Kategori<select name="category">${categoryOptions}</select></label>
      <label>Isi<textarea name="body" rows="5" required maxlength="1500"></textarea></label>
      <div class="act">
        <button type="button" class="ghost" onclick="dlg.close()">Batal</button>
        <button class="btn">Posting thread</button>
      </div>
    </form>`;
  dlg.showModal();
}

function submitThread(e) {
  e.preventDefault();
  const form = e.target;
  const id = Date.now();
  state.threads.unshift({
    id,
    category: form.category.value,
    title: form.title.value.trim(),
    body: form.body.value.trim(),
    author: state.user.name,
    role: state.user.role,
    date: id,
    likes: [],
    best: null,
    comments: [],
  });
  saveState();
  dlg.close();
  location.hash = '#/forum/' + id;
  toast('Thread diposting');
}

function toggleLike(id) {
  if (!requireLogin()) return;
  const thread = state.threads.find(t => t.id == id);
  const index = thread.likes.indexOf(state.user.name);
  if (index < 0) thread.likes.push(state.user.name);
  else thread.likes.splice(index, 1);
  saveState();
  render();
}

function submitComment(id) {
  if (!requireLogin()) return;
  const text = $('#ct').value.trim();
  if (!text) return toast('Tulis komentar dulu');

  state.threads.find(t => t.id == id).comments.push({
    author: state.user.name,
    role: state.user.role,
    text,
    date: Date.now(),
  });
  saveState();
  render();
  toast('Komentar terkirim');
}

function markBest(threadId, commentIndex) {
  state.threads.find(t => t.id == threadId).best = commentIndex;
  saveState();
  render();
}

/* ---------------------------------------------------------------------
   6. ROUTER
   Alamat -> halaman:  #/  #/berita  #/berita/3  #/forum  #/forum/2  #/tentang
   --------------------------------------------------------------------- */

const NAV_PAGES = ['', 'berita', 'forum', 'tentang']; // urutan sama dengan link di <nav>

function render() {
  const [, page, id] = (location.hash.slice(1) || '/').split('/');

  // Kanan atas header: tombol Masuk atau info pengguna
  $('#me').innerHTML = state.user
    ? `${avatar(state.user.name)}<span>${esc(state.user.name)} ${roleBadge(state.user.role)}</span>
       <button class="ghost" onclick="logout()">Keluar</button>`
    : '<button class="btn" onclick="openLogin()">Masuk</button>';

  // Tandai menu yang sedang aktif
  document.querySelectorAll('#nav a').forEach((link, i) =>
    link.classList.toggle('on', i === NAV_PAGES.indexOf(page || '')));

  // Pilih halaman
  let html;
  if (page === 'berita') html = id ? viewNewsDetail(id) : viewNewsList();
  else if (page === 'forum') html = id ? viewThread(id) : viewForum();
  else if (page === 'tentang') html = viewAbout();
  else html = viewHome();
  $('#app').innerHTML = html;

  if (!page) startCarousel();
}

function boot() {
  $('#logo').src = IMG.logo;
  window.onhashchange = () => { render(); window.scrollTo(0, 0); };
  render();
}
